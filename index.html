<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile menu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <aside class="mobile-menu">
        <div class="mobile-menu__header">
            <div class="mobile-menu__left">
                <button class="mobile-menu__button mobile-menu__button--type--burger">
                    <img src="Assets/images/Burger Icon Container.png" alt="" class="mobile-menu__button-icon">
                </button>
                <button class="mobile-menu__button mobile-menu__button--type--logo">
                    <img src="Assets/images/Group.png" alt="" class="mobile-menu__button-icon">
                </button>
            </div>

            <div class="mobile-menu__right">
                <button class="mobile-menu__button">
                    <img src="Assets/images/Search Icon Container.png" alt="" class="mobile-menu__button-icon">
                </button>
            </div>
        </div>




        <nav class="sidebar__nav">
            <ul class="sidebar__list">
                <li class="sidebar__item">
                    <a href="#" class="sidebar__link sidebar__link--state--active">Equipment repair</a>
                </li>
                <li class="sidebar__item">
                    <a href="#" class="sidebar__link sidebar__link--font--bold">Services and solutions</a>
                </li>
                <li class="sidebar__item"><a href="#" class="sidebar__link">Corporate clients</a></li>
                <li class="sidebar__item"><a href="#" class="sidebar__link">Equipment sellers</a></li>
                <li class="sidebar__item"><a href="#" class="sidebar__link">Partners</a></li>
                <li class="sidebar__item"><a href="#" class="sidebar__link">Manufacturers</a></li>
                <li class="sidebar__item"><a href="#" class="sidebar__link">Our service centres</a></li>
                <li class="sidebar__item"><a href="#" class="sidebar__link">Contracts</a></li>
            </ul>
        </nav>

        <div class="mobile-menu__footer">
            <div class="mobile-menu__footer-top">
                <button class="mobile-menu__button" aria-label="Call">
                    <img src="Assets/images/Chat Icon Container.png" alt="" class="mobile-menu__button-icon">
                </button>
                <button class="mobile-menu__button" aria-label="Search">
                    <img src="Assets/images/Chat Icon Container(1).png" alt="" class="mobile-menu__button-icon">
                </button>
                <button class="mobile-menu__button" aria-label="Profile">
                    <img src="Assets/images/Profile Icon Container.png" alt="" class="mobile-menu__button-icon">
                </button>
            </div>

            <div class="mobile-menu__footer-bottom">
                <p class="mobile-menu__footer-email">mail@cps.com</p>
                <p class="mobile-menu__footer-mobile-number">8 800 890 8900</p>
            </div>
        </div>

        <div class="mobile-menu__footer-language">
            <span class="language-option language-option--muted">RU</span>
            <span class="language-option language-option--active">EN</span>
            <span class="language-option">CH</span>
        </div>
    </aside>
</body>

</html>
